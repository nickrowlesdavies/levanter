name: Deploy Levanter

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours (UTC)
    - cron: "0 2 * * 1"     # Mondays 02:00 UTC = 06:00 GST, to prepare the weekly Signal
  workflow_dispatch:          # manual "Run workflow" button
  push:
    branches: [ main ]

# Token can publish to Pages and commit the review archive back to the repo.
permissions:
  contents: write
  pages: write
  id-token: write

# Never let two deploys race; a newer run supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Regenerate market data + build site
        run: bash cloud_build.sh

      # Persist two things back to the repo so the next rebuild is resilient:
      #  - review_archive.json: keeps past daily/weekly/monthly reviews.
      #  - the crypto_map seed (data + embedded charts): CoinGecko rate-limits CI,
      #    so a committed seed lets the crypto tab render from last-good data when
      #    the live fetch is skipped or fails. reports/ is gitignored, hence -f.
      # A GITHUB_TOKEN push does not retrigger workflows, so there is no loop.
      - name: Persist data cache + review archive
        run: |
          git config user.name "levanter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add review_archive.json signal_state.json
          git add -f reports/crypto_map.json reports/crypto_map_treemap.png reports/crypto_map_correlation.png 2>/dev/null || true
          git add -f reports/signals/*.md reports/signals/docx/*.docx 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "nothing to persist"
          else
            git commit -m "Update data cache + review archive [skip ci]"
            git push origin HEAD:main
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
