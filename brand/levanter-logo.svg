<svg width="520" height="140" viewBox="0 0 520 140" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tradewinds">
  <defs>
    <linearGradient id="twGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="0.55" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <!-- Mark: rounded badge with wind gusts rising left-to-right + up-arrow -->
  <g transform="translate(10,20)">
    <rect x="0" y="0" width="100" height="100" rx="26" fill="url(#twGrad)"/>
    <g fill="none" stroke="#ffffff" stroke-linecap="round">
      <path d="M22 70 C40 62 54 62 72 66" stroke-width="7" opacity="0.5"/>
      <path d="M22 52 C44 42 62 42 82 48" stroke-width="7.5"/>
      <path d="M22 34 C38 28 50 28 64 31" stroke-width="7" opacity="0.82"/>
    </g>
    <!-- arrow tip on the main gust, pointing up-right (markets rising) -->
    <path d="M74 40 l12 -5 -3 12" fill="none" stroke="#ffffff" stroke-width="7"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark -->
  <text x="132" y="72" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif"
        font-size="40" font-weight="800" letter-spacing="1.5" fill="#0f172a">LEVANTER</text>
  <text x="134" y="98" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif"
        font-size="15.5" font-weight="600" letter-spacing="3.4" fill="#64748b">MARKETS · SIGNALS · INSIGHT</text>
</svg>
