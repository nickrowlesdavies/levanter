# Copy this file to  oanda.secret.yaml  and fill in your details.
# oanda.secret.yaml is git-ignored and never leaves your machine.
#
# Where to get these (free, ~2 minutes):
#   1. Sign up for a practice/demo account: https://www.oanda.com/  (fxTrade Practice)
#   2. Manage API Access: https://www.oanda.com/account/tpa/personal_token
#      -> "Generate" a Personal Access Token  = api_token below
#   3. Your account ID looks like 101-004-XXXXXXX-001 (My Account -> Manage Funds,
#      or the "My Services" / v20 account list). Use the practice account ID.

api_token: "PASTE_YOUR_PERSONAL_ACCESS_TOKEN_HERE"
account_id: "101-000-0000000-001"
environment: "practice"   # keep as practice for the trial; "live" only much later
